<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучение | Инвестиции</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #ffffff;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .login-box {
            background: #0a0a0a;
            padding: 48px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2a2a;
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #6b6b6b;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #d0d0d0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #e0e0e0;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            text-align: center;
            color: #ff4444;
            font-size: 14px;
        }

        .main-container {
            display: none;
            min-height: 100vh;
        }

        .header {
            background: #0a0a0a;
            border-bottom: 1px solid #2a2a2a;
            padding: 16px 32px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            padding: 8px 20px;
            border-radius: 20px;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .nav-btn:hover {
            background: #1a1a1a;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #333, #1a1a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }

        .profile-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 12px;
            color: #888;
        }

        .level-badge {
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: #1a1a1a;
        }

        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .videos-section h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 32px;
        }

        .video-card {
            background: #0a0a0a;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-title {
            padding: 16px 20px 4px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .video-subtitle {
            padding: 0 20px 20px;
            font-size: 14px;
            color: #888888;
        }

        @media (max-width: 768px) {
            .videos-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 12px 16px;
            }
            .profile-left {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div id="loginPage" class="login-container">
    <div class="login-box">
        <h1>Корпоративное обучение</h1>
        <p class="subtitle">Войдите с использованием своих учетных данных</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <button type="submit" class="login-btn">Войти</button>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </form>
    </div>
</div>

<div id="mainPage" class="main-container">
    <div class="header">
        <div class="header-content">
            <div class="profile-left">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="profile-info">
                    <h3 id="userName">Загрузка...</h3>
                    <p id="userTelegram">@загрузка</p>
                </div>
                <div class="level-badge" id="levelBadge">Уровень 1</div>
                <div class="nav-buttons">
                    <button class="nav-btn active" id="mainPageBtn">Главная</button>
                    <button class="nav-btn" id="materialsBtn">Материалы</button>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <div class="content" id="contentArea"></div>
</div>

<script>
    const SUPABASE_URL = 'https://hmlcwfrbymdnofhunibd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_25VHjp6VP8_OcNsPuBBpqg_0hua7oPG';
    
    let currentUser = null;
    let currentPage = 'main';

    // ВСЕ ВИДЕО (уроки 1-4)
    const allVideos = [
        { id: 1, level: 1, file: 'sfeeeeeeeera.mp4', title: 'Урок 1', subtitle: 'Сфера инвестиций' },
        { id: 2, level: 1, file: 'filtrasia.mp4', title: 'Урок 2', subtitle: 'Фильтрация трафика' },
        { id: 3, level: 2, file: 'Vbros.mp4', title: 'Урок 3', subtitle: 'Вброс' },
        { id: 4, level: 2, file: 'predloga.mp4', title: 'Урок 4', subtitle: 'Предлога' }
    ];

    async function checkUserLogin(login, password) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users?login=eq.${login}&select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                const users = await response.json();
                if (users.length > 0 && users[0].password === password) {
                    return { success: true, user: users[0] };
                }
            }
            return { success: false, error: 'Неверный логин или пароль' };
        } catch (error) {
            return { success: false, error: 'Ошибка подключения к базе данных' };
        }
    }

    // Видео для главной страницы (по текущему уровню)
    function getMainPageVideos() {
        if (currentUser.current_level === 1) {
            return allVideos.filter(v => v.level === 1);
        } else if (currentUser.current_level === 2) {
            return allVideos.filter(v => v.level === 2);
        }
        return [];
    }

    // Видео для материалов (все разблокированные уровни)
    function getMaterialsVideos() {
        if (currentUser.current_level === 1) {
            return allVideos.filter(v => v.level === 1);
        } else if (currentUser.current_level === 2) {
            return allVideos; // Все 4 видео
        }
        return [];
    }

    function renderVideos(videos) {
        const contentArea = document.getElementById('contentArea');
        
        if (!videos || videos.length === 0) {
            contentArea.innerHTML = '<div style="text-align:center;padding:60px;background:#0a0a0a;border-radius:16px;"><h2>📚 Нет доступных видео</h2><p>Видео для этого уровня еще не добавлены</p></div>';
            return;
        }

        contentArea.innerHTML = `
            <div class="videos-section">
                <h1>📹 Обучающие видео</h1>
                <div class="videos-grid">
                    ${videos.map(video => `
                        <div class="video-card">
                            <video controls>
                                <source src="https://hmlcwfrbymdnofhunibd.supabase.co/storage/v1/object/public/videos1/${video.file}" type="video/mp4">
                            </video>
                            <div class="video-title">${video.title}</div>
                            <div class="video-subtitle">${video.subtitle}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function updateContent() {
        if (!currentUser) return;
        
        if (currentPage === 'main') {
            const videos = getMainPageVideos();
            renderVideos(videos);
        } else if (currentPage === 'materials') {
            const videos = getMaterialsVideos();
            renderVideos(videos);
        }
    }

    async function performLogin(login, password) {
        const result = await checkUserLogin(login, password);
        
        if (result.success) {
            currentUser = result.user;
            
            localStorage.setItem('userId', currentUser.id);
            localStorage.setItem('userLogin', currentUser.login);
            
            document.getElementById('userName').textContent = currentUser.full_name;
            document.getElementById('userTelegram').textContent = `@${currentUser.telegram_nick}`;
            document.getElementById('levelBadge').textContent = `Уровень ${currentUser.current_level}`;
            
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
            
            currentPage = 'main';
            document.getElementById('mainPageBtn').classList.add('active');
            document.getElementById('materialsBtn').classList.remove('active');
            updateContent();
        } else {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = result.error;
            errorDiv.style.display = 'block';
        }
    }

    async function checkAutoLogin() {
        const savedUserId = localStorage.getItem('userId');
        const savedUserLogin = localStorage.getItem('userLogin');
        
        if (savedUserId && savedUserLogin) {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${savedUserId}&select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const users = await response.json();
                    if (users.length > 0) {
                        currentUser = users[0];
                        
                        document.getElementById('userName').textContent = currentUser.full_name;
                        document.getElementById('userTelegram').textContent = `@${currentUser.telegram_nick}`;
                        document.getElementById('levelBadge').textContent = `Уровень ${currentUser.current_level}`;
                        
                        document.getElementById('loginPage').style.display = 'none';
                        document.getElementById('mainPage').style.display = 'block';
                        
                        currentPage = 'main';
                        document.getElementById('mainPageBtn').classList.add('active');
                        document.getElementById('materialsBtn').classList.remove('active');
                        updateContent();
                    }
                }
            } catch (error) {
                console.error('Auto-login error:', error);
            }
        }
    }

    // Обработчики событий
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const login = document.getElementById('loginInput').value;
        const password = document.getElementById('passwordInput').value;
        await performLogin(login, password);
    });
    
    document.getElementById('mainPageBtn').addEventListener('click', () => {
        currentPage = 'main';
        document.getElementById('mainPageBtn').classList.add('active');
        document.getElementById('materialsBtn').classList.remove('active');
        updateContent();
    });
    
    document.getElementById('materialsBtn').addEventListener('click', () => {
        currentPage = 'materials';
        document.getElementById('materialsBtn').classList.add('active');
        document.getElementById('mainPageBtn').classList.remove('active');
        updateContent();
    });
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
        currentUser = null;
        localStorage.removeItem('userId');
        localStorage.removeItem('userLogin');
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('loginInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('loginError').style.display = 'none';
    });
    
    // Запуск
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('mainPage').style.display = 'none';
    
    checkAutoLogin();
</script>

</body>
</html>
