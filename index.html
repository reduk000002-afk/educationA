<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео из Supabase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 32px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 32px;
        }
        .video-card {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            overflow: hidden;
        }
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
        }
        .video-title {
            padding: 16px;
            font-size: 18px;
            font-weight: 500;
        }
        .error {
            color: #ff4444;
            padding: 20px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📹 Обучающие видео (из Supabase)</h1>
    <div id="videosContainer" class="video-grid">
        <div class="loading">Загрузка видео...</div>
    </div>
</div>

<script>
    // ТВОИ ДАННЫЕ SUPABASE
    const SUPABASE_URL = 'https://hmlcwfrbymdnofhunibd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_25VHjp6VP8_OcNsPuBBpqg_0hua7oPG';

    async function loadVideos() {
        const container = document.getElementById('videosContainer');
        
        try {
            // Запрашиваем список видео из таблицы
            const response = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const videos = await response.json();
            
            if (videos.length === 0) {
                container.innerHTML = '<div class="error">Видео не найдены. Добавьте видео в таблицу.</div>';
                return;
            }

            // Показываем видео
            container.innerHTML = videos.map(video => `
                <div class="video-card">
                    <video controls>
                        <source src="${video.url}" type="video/mp4">
                        Ваш браузер не поддерживает видео
                    </video>
                    <div class="video-title">${video.title}</div>
                </div>
            `).join('');

        } catch (error) {
            console.error('Ошибка:', error);
            container.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}<br><br>
            Проверь:<br>
            1. Таблица "videos" создана в Supabase<br>
            2. В таблице есть записи<br>
            3. Видео загружены в Storage bucket "videos1"<br>
            4. CORS настроен (см. инструкцию)</div>`;
        }
    }

    loadVideos();
</script>
</body>
</html>
